[package]
name = "rcal"
version = "0.1.0"
edition = "2024"
description = "A CLI calendar tool with CalDAV synchronization"
license = "GPL-3.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
ical = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
roxmltree = "0.21"
rpassword = "7"
url = "2"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = true
