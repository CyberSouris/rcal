name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Install bats-core
        run: |
          set -euo pipefail
          mkdir -p /tmp/batscli
          git clone --depth 1 --branch v1.11.1 \
            https://github.com/bats-core/bats-core /tmp/batscore
          /tmp/batscore/install.sh /tmp/batscli

      - name: Run black-box CLI (bats) suite
        run: |
          export PATH="/tmp/batscli/bin:$PATH"
          /tmp/batscli/bin/bats tests/cli/observer.bats

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install bats-core and llvm coverage tools
        run: |
          set -euo pipefail
          mkdir -p /tmp/batscli
          git clone --depth 1 --branch v1.11.1 \
            https://github.com/bats-core/bats-core /tmp/batscore
          /tmp/batscore/install.sh /tmp/batscli
          rustup component add llvm-tools-preview || rustup component add llvm-tools

      - name: Build binary and unit-test harness instrumented for coverage
        run: |
          set -euo pipefail
          RUSTFLAGS="-C instrument-coverage" cargo build --bin rcal
          RUSTFLAGS="-C instrument-coverage" cargo test --no-run

      - name: Drive unit tests and the CLI (bats) under one coverage profile
        env:
          LLVM_PROFILE_FILE: /tmp/batsprof/rcal-%p.profraw
          RUSTFLAGS: "-C instrument-coverage"
        run: |
          set -euo pipefail
          mkdir -p /tmp/batsprof target/coverage
          cargo test
          /tmp/batscli/bin/bats tests/cli/observer.bats

      - name: Merge profraws and export a single merged lcov
        run: |
          set -euo pipefail
          COV="$HOME/.rustup/toolchains/$(rustup show active-toolchain | cut -d' ' -f1)/lib/rustlib/x86_64-unknown-linux-gnu/bin"
          mkdir -p target/coverage
          shopt -s nullglob
          profraws=(/tmp/batsprof/*.profraw)
          if [ "${#profraws[@]}" -eq 0 ]; then
            echo "No .profraw files found in /tmp/batsprof" >&2
            exit 1
          fi
          "$COV/llvm-profdata" merge -sparse "${profraws[@]}" \
            -o /tmp/rcal.profdata
          TESTBIN="$(find target/debug/deps -maxdepth 1 -type f -executable -name 'rcal-*' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          if [ -z "${TESTBIN}" ] || [ ! -x "${TESTBIN}" ]; then
            echo "Could not locate instrumented rcal test binary in target/debug/deps" >&2
            exit 1
          fi
          "$COV/llvm-cov" export --format lcov \
            --instr-profile /tmp/rcal.profdata \
            --object ./target/debug/rcal \
            --object "${TESTBIN}" \
            > target/coverage/merged.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/merged.lcov
          fail_ci_if_error: false
